<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14.6 -2.8 129.2 129.2">
  <!--
    Bolt mark, built on a golden-ratio grid (φ ≈ 1.618), 100 units wide.
    Grid lines: 14.6 · 23.6 · 38.2 · 47.2 · 61.8 · 76.4 · 100 (φ powers of 100).
    Height = 2/φ × width = 123.6. Top, lower and step edges share slope 1/φ;
    the middle diagonal has slope φ. Rounded corners come from one round-join
    stroke (5.6 = band thickness 38.2 × 1/φ⁴) used for the body and the tail.
    Color: the accent token (#2f5d62), and its generated dark-mode value.
  -->
  <style>
    .mark { fill: #2f5d62; stroke: #2f5d62; }
    .tail { fill: none; stroke: #2f5d62; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #8eb7bb; stroke: #8eb7bb; }
      .tail { stroke: #8eb7bb; }
    }
  </style>
  <g stroke-width="5.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Body: upper band, step, middle diagonal, lower band -->
    <path class="mark" d="M0 47.2 L76.4 0 V52.8 L100 47.2 V76.4 L61.8 100 L38.2 61.8 L14.6 76.4 Z"/>
    <!-- Tail: hollow triangle hanging from the lower band -->
    <path class="tail" d="M100 76.4 V123.6 L76.4 91 Z"/>
  </g>
</svg>
