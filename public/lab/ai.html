<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI lab</title>
<style>
  :root { --bg: #fff; --fg: #1b1b1f; --muted: #6b6b76; --line: #e3e3e8; --accent: #3b5bdb; --add: #e6f4ea; --add-fg: #1e6b34; --del: #fdecea; --del-fg: #a1261b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131316; --fg: #ececf1; --muted: #9a9aa6; --line: #2b2b33; --accent: #7c93ff; --add: #15301f; --add-fg: #8fdca5; --del: #3a1714; --del-fg: #ff9b8f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 100dvh; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button, .btn { border: 1px solid var(--line); background: none; color: inherit; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .tabs button[aria-pressed="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 6px; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .msg { padding: 8px 12px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.bot { align-self: flex-start; border: 1px solid var(--line); }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  form { display: flex; gap: 8px; }
  form input { flex: 1; min-width: 0; border: 1px solid var(--line); background: none; color: inherit; border-radius: 999px; padding: 8px 14px; font: inherit; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .card .field { font-size: 12px; color: var(--muted); }
  .card del { background: var(--del); color: var(--del-fg); text-decoration: line-through; padding: 1px 4px; border-radius: 4px; }
  .card ins { background: var(--add); color: var(--add-fg); text-decoration: none; padding: 1px 4px; border-radius: 4px; }
  .card .row { display: flex; gap: 6px; justify-content: flex-end; }
  .card.done { opacity: .6; }
  pre { margin: 0; font-size: 12px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
</style>
<script type="module" src="./ai.js"></script>
</head>
<body>
<main>
  <h1>AI lab <span class="muted">· runs on your device, no account, no shared limit</span></h1>
  <div class="tabs" role="group" aria-label="Mode">
    <button type="button" data-mode="chat" aria-pressed="true">Visitor chat</button>
    <button type="button" data-mode="edit" aria-pressed="false">Edit with AI</button>
  </div>
  <div id="setup">
    <button type="button" class="btn primary" id="load" hidden>Download the AI (about 730 MB, once)</button>
    <p class="muted" id="status">Checking…</p>
    <progress id="bar" max="100" value="0" hidden></progress>
  </div>
  <details id="data" hidden><summary>Portfolio data the AI uses</summary><pre id="resume"></pre></details>
  <div id="log" aria-live="polite"></div>
  <form id="ask">
    <input id="q" autocomplete="off" placeholder="Ask about Mustafa…" aria-label="Message">
    <button class="btn primary" id="send">Send</button>
  </form>
</main>
</body>
</html>
