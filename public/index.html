<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://raw.githubusercontent.com https://www.googleapis.com https://registry.jsonresume.org; frame-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>mz-portfolio</title>
  <meta name="description" content="A fast, mobile-first portfolio with projects, a blog and a printable resume, edited on the page and saved to your GitHub.">
  <meta property="og:site_name" content="mz-portfolio">
  <meta property="og:title" content="mz-portfolio">
  <meta property="og:description" content="A fast, mobile-first portfolio with projects, a blog and a printable resume, edited on the page and saved to your GitHub.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/images/logo.svg">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
  <!-- Google settings stay empty here: functions/_middleware.js fills them
       from the GOOGLE_API_KEY / GOOGLE_CLIENT_ID Pages variables (locally:
       .dev.vars via tools/dev-server.mjs). See README. -->
  <meta name="mz-google-api-key" content="">
  <meta name="mz-google-client-id" content="">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/logo.svg">
  <link rel="modulepreload" href="/scripts/index.js?v=5">
  <link rel="modulepreload" href="/scripts/app.js">
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="stylesheet" href="/styles/style.css?v=5">
</head>
<body>
  <div id="app" aria-live="polite" aria-busy="true">
    <noscript>
      <main class="status-page">
        <div class="status-card">
          <h1 class="status-title">JavaScript is required</h1>
          <p class="status-text">This portfolio is built in your browser. Please enable JavaScript and reload.</p>
        </div>
      </main>
    </noscript>
  </div>

  <script type="module" src="/scripts/index.js?v=5"></script>
</body>
</html>
