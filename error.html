<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error - Portfolio</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: light-dark(#1a1a1a, #e0e0e0);
      background: light-dark(#fff, #0d0d0d);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .error-container {
      text-align: center;
      max-width: 500px;
    }
    .error-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: light-dark(#1a1a1a, #e0e0e0);
    }
    p {
      color: light-dark(#666, #aaa);
      margin-bottom: 24px;
      font-size: 16px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a, button {
      background: light-dark(#0066cc, #4a9eff);
      color: light-dark(#fff, #000);
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    a:hover, button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="error-container">
        <div class="error-icon">!</div>
    <h1>Something Went Wrong</h1>
    <p>We encountered an error loading your portfolio. Please try again or contact support.</p>
    <div class="actions">
      <button onclick="location.reload()">Try Again</button>
      <a href="/">Go Home</a>
    </div>
  </div>
</body>
</html>
