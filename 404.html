<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Redirecting...</title>
  <script>
    // GitHub Pages SPA routing redirect.
    // When GitHub Pages serves this 404.html for a path like /repo/username,
    // we encode the extra path segments into the query string so that index.html
    // can restore the URL client-side via history.replaceState.
    //
    // segmentCount = 1  →  keeps the first segment (/repo-name) in the base path.
    // Set to 0 for a user/org GitHub Pages site (username.github.io).
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
