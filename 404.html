<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Redirecting...</title>
  <script>
    // GitHub Pages SPA routing redirect.
    // When GitHub Pages serves this 404.html for a path like /repo/username,
    // we encode the extra path segments into the query string so that index.html
    // can restore the URL client-side via history.replaceState.
    //
    // segmentCount controls how many leading path segments belong to the "base"
    // (i.e. are NOT the user-supplied path):
    //
    //   segmentCount = 1  (default) →  project site: username.github.io/repo-name/...
    //                                  keeps /repo-name/ in the base path.
    //
    //   segmentCount = 0            →  user/org site: username.github.io/...
    //                                  the root IS the base; change to 0 if you deploy
    //                                  to a user/org GitHub Pages site or a custom domain.
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
