<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/tokens.css">
  <style>body{margin:0;min-height:100vh;background:var(--color-b);color:var(--color-c);font-family:var(--font-family)}</style>
  <script>
    // GitHub Pages serves this file for unknown paths (e.g. /username).
    // Hand the path to the app via ?p=, which restores it without a reload.
    // If the site lives in a sub-folder (project site), set BASE to "/repo-name/".
    (function () {
      var BASE = "/";
      var path = location.pathname;
      if (path.indexOf(BASE) === 0) path = path.slice(BASE.length);
      var query = location.search ? "&" + location.search.slice(1) : "";
      location.replace(BASE + "?p=" + encodeURIComponent(path) + query + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
